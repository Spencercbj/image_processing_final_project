name: deblur
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      # PyTorch built against CUDA 12.4 (RTX 40-series). Must use this index.
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0
      - torchvision==0.21.0
      # diffusion / restoration stack
      - diffusers==0.29.2
      - transformers==4.45.2
      - accelerate==0.28.0
      - pytorch-lightning==2.2.1
      - safetensors==0.7.0
      - omegaconf==2.3.0
      - timm==1.0.27
      # deblur / SR model deps
      - basicsr==1.4.2
      - facexlib==0.3.0
      - gfpgan==1.3.8
      - einops==0.7.0
      # imaging / numerics
      - opencv-python==4.13.0.92
      - scikit-image==0.25.2
      - scipy==1.15.3
      - numpy==2.2.6
      - pillow==12.2.0
# NOTE: do NOT `pip install xformers` — it pulls a CPU-only torch and breaks CUDA.
